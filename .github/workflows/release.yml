name: release

on:
  # Publish only on version tags like v0.1.0
  push:
    tags:
      - 'v*'
  # Allow manual runs
  workflow_dispatch:

# Minimal default permissions for all jobs
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    # OIDC + ability to fetch artifacts built in previous job
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: pypi
      url: https://pypi.org/project/htoolbox/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); print(d.get('project',{}).get('version',''))")
          if [ -z "$ver" ]; then
            echo "Version not found in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Check if version already on PyPI
        id: pypi
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="htoolbox"
          VERSION_EXISTS=$(python -c "import json,os,urllib.request; data=json.load(urllib.request.urlopen('https://pypi.org/pypi/htoolbox/json',timeout=10)); print('true' if os.environ.get('VERSION') in data.get('releases',{}) else 'false')") || VERSION_EXISTS=false
          echo "exists=$VERSION_EXISTS" >> "$GITHUB_OUTPUT"
          echo "PyPI has version? $VERSION_EXISTS"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Skip notice (already published)
        if: steps.pypi.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already exists on PyPI; skipping publish."
