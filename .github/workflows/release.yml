name: release

on:
  # Safer default: publish only on version tags like v0.1.0
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Minimal default permissions for all jobs
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    # OIDC + ability to fetch artifacts built in previous job
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: pypi
      url: https://pypi.org/project/htoolbox/

    steps:
      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python - <<'PY'
import tomllib, sys
with open("pyproject.toml", "rb") as f:
    data = tomllib.load(f)
print(data.get("project", {}).get("version", ""))
PY
          )
          if [ -z "$ver" ]; then
            echo "Version not found in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Check if version already on PyPI
        id: pypi
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="htoolbox"
          VERSION_EXISTS=$(python - <<'PY'
import json, sys, urllib.request, os
pkg = "htoolbox"
try:
    with urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/json", timeout=10) as r:
        data = json.load(r)
    versions = set(data.get("releases", {}).keys())
except Exception:
    versions = set()
ver = os.environ.get("VERSION")
print("true" if ver in versions else "false")
PY
          )
          echo "exists=$VERSION_EXISTS" >> "$GITHUB_OUTPUT"
          echo "PyPI has version? $VERSION_EXISTS"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Skip notice (already published)
        if: steps.pypi.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already exists on PyPI; skipping publish."
