session: devbox
focus_window: 0
kill: true
windows:
  - window: workspace
    num_panes: py`2 + 1`   # evaluated to 3
    layout: ev
    focus_pane: 0
    kill: true
    synchronized_panes: true
    commands:
      - pane_index: "0-1"
        commands:
          - echo "workspace panes ready"
          - sleep 20 && ls /eee
      - pane_index: "0"
        commands:
          - cd @@workdir@@
          - bash
      - pane_index: "1"
        commands:
          - cd @@workdir@@
          - ls -la
      # sentinel: false — send the command and move on without waiting
      - pane_index: "2"
        sentinel: false
        commands:
          - top
  - window: monitoring
    num_panes: 2
    layout: tiled
    focus_pane: 0
    kill: true
    commands:
      - pane_index: "0"
        commands:
          - tail -f /var/log/system.log
      - pane_index: "1"
        commands:
          - ping -c 5 8.8.8.8
